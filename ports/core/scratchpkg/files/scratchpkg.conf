#
# /etc/scratchpkg.conf : scratchpkg configuration (BFSOS variant)
#
# The BFSOS port tree on this branch names its recipes `.spkgbuild` instead of
# upstream's `spkgbuild`.  pkgbuild takes the recipe name from the shell
# variable below and sources this config file after its own defaults, so the
# tree's naming convention works with an unmodified upstream scratchpkg.
# See docs/SCRATCHPKG-VARIANT.md.
#
# Set this to "spkgbuild" to use upstream-Venom-style recipe names instead.
PKGBUILD_BSCRIPT=".spkgbuild"

export CFLAGS="-O2 -march=x86-64 -pipe"
export CXXFLAGS="$CFLAGS"
export MAKEFLAGS="-j$(nproc 2>/dev/null || echo 1)"

# Packages are zstd-compressed like the rest of BFSOS's archives.  pkgbuild
# supports gz, bz2, xz, lz4 and zstd.
COMPRESSION_MODE="zstd"

# Package build policy: strip binaries, keep the defaults for locale/doc/libtool
# removal, and check checksums when a port ships a .checksums file.
NO_STRIP="no"
KEEP_LIBTOOL="no"
KEEP_LOCALE="no"
KEEP_DOC="no"
IGNORE_MDSUM="no"

# Cache locations (defaults; uncomment to relocate).
# SOURCE_DIR="/var/cache/scratchpkg/sources"
# PACKAGE_DIR="/var/cache/scratchpkg/packages"
# WORK_DIR="/var/cache/scratchpkg/work"
# CURL_OPTS=""
