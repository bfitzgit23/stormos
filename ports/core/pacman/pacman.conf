#
# /etc/pacman.conf
#
# BFSOS pacman configuration. The bfsos local repository holds source-built
# pacman-format packages; the `bfsos` CLI wrapper is the supported front end
# for install/upgrade on BFSOS systems.
#
# See pacman.conf(5) for directives.
#

[options]
# Root is standard.
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
HookDir     = /etc/pacman.d/hooks/
GPGDir      = /etc/pacman.d/gnupg/
LogFile     = /var/log/pacman.log
HoldPkg     = pacman glibc
# BFSOS delivers the source-built package archive with zstd compression.
XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
CleanMethod = KeepInstalled
Architecture = auto

# BFSOS source builds are trusted by construction; pacman signature
# checking is enabled but the local repo is signed only if the admin
# configured it. Leave SigLevel per-repository so the local repo works
# without a keyring, and stricter options are opt-in.
SigLevel    = PackageOptional PackageTrustedRequired
LocalFileSigLevel = Optional
ParallelDownloads = 3

# NoDownload options for BFSOS:

#
# REPOSITORIES
#   - can be defined here or in include files
#

[bfsos]
# The BFSOS source-built repository. Local by default - point this mirror
# at your build host once you have one (see /etc/pacman.d/mirrorlist).
SigLevel = Optional TrustAll
Include = /etc/pacman.d/mirrorlist

# Cross-repo integration with Arch Linux, Artix, etc., is not configured by
# default — BFSOS source builds are built against BFSOS glibc/toolchain, and
# mixing repositories built against a different ABI risks subtle breakage.
# If you accept that risk you can add an [arch]/[extra]/[multilib] section
# pointing at Arch mirrors in a local drop-in file in /etc/pacman.d/.
